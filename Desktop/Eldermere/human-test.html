<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eldermere step 13a</title>
<style>
  :root { --panel: rgba(30,22,24,0.9); --text: #f1e7dc; --muted: #c2b3a4; --accent: #b29cf0; --line: rgba(178,156,240,0.25);
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --panel: rgba(250,244,236,0.93); --text: #2a2026; --muted: #6a5a50; --accent: #6a4fc0; --line: rgba(106,79,192,0.25); } }
  :root[data-theme="dark"] { --panel: rgba(30,22,24,0.9); --text: #f1e7dc; --muted: #c2b3a4; --accent: #b29cf0; --line: rgba(178,156,240,0.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #24180f; overflow: hidden; font: 14px/1.4 Georgia, serif; color: var(--text); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  .panel { position: fixed; top: calc(0.75rem + env(safe-area-inset-top, 0px)); right: 0.75rem; bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); width: 19rem; overflow-y: auto; background: var(--panel); border-radius: 8px; padding: 1rem 1.1rem; }
  h1 { font-size: 1.15rem; font-weight: 400; margin: 0 0 0.2rem; }
  .note { color: var(--muted); margin: 0 0 0.9rem; }
  h2 { font-size: 0.95rem; font-weight: 400; color: var(--accent); margin: 1.1rem 0 0.5rem; padding-top: 0.8rem; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 6.5rem 1fr; align-items: center; gap: 0.5rem; margin: 0.25rem 0; }
  .row span { color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .btns button { font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 0.25rem 0.6rem; cursor: pointer; }
  .btns button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: #17121a; }
  select.pick, select.pick option { background: #1d1720; color: #eae4ee; }
  select.pick { height: 1.9rem; margin: 0.15rem 0 0.35rem; padding: 0 0.3rem; font: inherit; }
  .pick { width: 100%; height: 1.6rem; border: 1px solid var(--line); border-radius: 4px; background: transparent; padding: 0 2px; cursor: pointer; }
  .sw { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .sw button { width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: var(--c); cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  details { border-top: 1px solid var(--line); padding: 0.5rem 0; }
  summary { cursor: pointer; color: var(--accent); font-size: 0.95rem; padding: 0.2rem 0; }
  .search { width: 100%; font: inherit; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 0.4rem 0.6rem; margin: 0.6rem 0 0.4rem; }
  .tools { margin-bottom: 0.6rem; }
  .row { grid-template-columns: 8.5rem 1fr; }
  .views { position: fixed; left: 0.75rem; bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px)); background: var(--panel); border-radius: 6px; padding: 0.5rem; }
  @media (max-width: 720px) { .panel { top: auto; left: 0.5rem; right: 0.5rem; width: auto; height: 45%; } .views { bottom: calc(45% + 1.2rem); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside class="panel" aria-label="Character controls">
  <h1>Human base, step 13a</h1>
  <p class="note">MakeHuman CC0 base mesh with our own morph engine. Drag the model to turn it. Double-click a slider to reset it.</p>
  <div class="btns"><button data-preset="male">Male</button><button data-preset="female">Female</button></div>
  <div id="controls"></div>
</aside>
<div class="views btns"><button data-view="full" aria-pressed="true">Full body</button><button data-view="face" aria-pressed="false">Face</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { loadHuman } from './src/rpg/human.js';
import { startViewer } from './src/rpg/humanViewer.js';
const human = await loadHuman('./data/human/');
startViewer(THREE, human, {
  canvas: document.getElementById('c'),
  controls: document.getElementById('controls'),
  presets: [...document.querySelectorAll('[data-preset]')],
  views: [...document.querySelectorAll('[data-view]')],
});
</script>
</body>
</html>
